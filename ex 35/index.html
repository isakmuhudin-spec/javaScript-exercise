
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>


<h1>Welcome</h1>

    <img id="image" src="image.png" alt="Image" width="200">
    <button onclick="changeImage()">Change Image</button>

    <script>
    
    
    
       function changeImage() {

    const image = document.querySelector('#image');

    const url = prompt("Please enter your image url")

    image.setAttribute('src', 'https://images.unsplash.com/photo-1759662232622-6c0754a379f4?w=600&auto=format&fit=crop&q=60&ixlib=rb-4.1.0&ixid=NHwxMjA3fDA%3D')

    
    image.style.border = '1px solid green';
    image.style.padding = "10px";
    

    image.style.backgroundColor = "#cfc2dc";

}


function changeContentStyle() {

    const header = document.querySelector("#header");
    const text = document.querySelector(".text");

    
    header.style.color = "skyblue";
    text.style.padding = "20px";
    text.style.border = "1px solid black";
    text.style.fontSize = "30px";
}




function setLightMode() {

    document.body.style.backgroundColor = "white";
    document.body.style.color = "black";

}

function setDarkMode() {

    document.body.style.backgroundColor = "black";
    document.body.style.color = "white";

}
    </script>




    
<script src="main.js"></script>
</body>
</html>
